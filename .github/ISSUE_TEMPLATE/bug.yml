name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest code, persona or workflow TOML and commands that show the problem.
      render: rust
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Troupekit version or commit
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and Rust version
      placeholder: macOS 15 aarch64, rustc 1.89
    validations:
      required: true
  - type: input
    id: features
    attributes:
      label: Enabled features
      placeholder: default, knowledge
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: text
