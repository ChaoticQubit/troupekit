name: bless

on:
  push:
    branches:
      - 'bless/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  golden:
    name: bless golden checkpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: stable toolchain
        run: rustup default stable
      - name: bless
        env:
          TROUPEKIT_BLESS: "1"
        run: cargo test -p troupekit-graph golden -- --test-threads=1
      - name: verify
        run: cargo test -p troupekit-graph golden -- --test-threads=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: golden-fixtures
          path: |
            crates/troupekit-graph/tests/fixtures/v1/
            crates/troupekit-graph/tests/golden.rs
          if-no-files-found: error
