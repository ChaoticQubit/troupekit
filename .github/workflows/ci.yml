name: ci

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BEND_NO_TELEMETRY: "1"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
            phone: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            cross: false
            phone: false
          - target: aarch64-linux-android
            runner: ubuntu-latest
            cross: true
            phone: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
            phone: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: add target
        if: matrix.cross
        run: rustup target add ${{ matrix.target }}
      - name: android toolchain
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"
      - name: build workspace
        if: '!matrix.cross'
        run: cargo build --workspace --locked
      - name: build workspace for target
        if: matrix.cross
        run: cargo build --workspace --exclude troupekit-py --locked --target ${{ matrix.target }}
      - name: build without the TLS stack
        if: matrix.phone
        run: cargo build -p troupekit --no-default-features --features sqlite --locked --target ${{ matrix.target }}
      - name: store test on Windows
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: "cargo test -p troupekit-store-sqlite --locked --test main -- smoke::"

  test:
    name: test ${{ matrix.runner }}
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('Cargo.lock') }}
      - name: boundary
        run: sh scripts/check-boundary.sh
      - name: test changed crates
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set +e
          pkgs="$(sh scripts/changed-crates.sh "origin/$BASE")"
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "no crate changed"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "changed-crates.sh failed with exit $code"
            exit "$code"
          fi
          cargo test --locked $pkgs

  cipher:
    name: cipher ${{ matrix.feature }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [sqlcipher, sqlcipher-system]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.feature }}-${{ hashFiles('Cargo.lock') }}
      - name: system OpenSSL
        if: matrix.feature == 'sqlcipher-system'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: test
        run: cargo test -p troupekit-store-sqlite --features ${{ matrix.feature }} --locked

  cipher-build:
    name: cipher-build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cipher-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: add target
        run: rustup target add ${{ matrix.target }}
      - name: android toolchain
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"
      - name: build
        run: cargo build -p troupekit-store-sqlite --features sqlcipher --locked --target ${{ matrix.target }}

  macos:
    name: macos
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macOS-all-${{ hashFiles('Cargo.lock') }}
      - name: add ios target
        run: |
          grep -q '\.iOS(\.v16)' Package.swift
          rustup target add aarch64-apple-ios
      - name: build workspace
        if: ${{ !cancelled() }}
        run: cargo build --workspace --locked
      - name: build workspace for ios
        if: ${{ !cancelled() }}
        run: cargo build --workspace --exclude troupekit-cli --exclude troupekit-py --locked --target aarch64-apple-ios
      - name: build ios without the TLS stack
        if: ${{ !cancelled() }}
        run: cargo build -p troupekit --no-default-features --features sqlite --locked --target aarch64-apple-ios
      - name: cipher build for ios
        if: ${{ !cancelled() }}
        run: cargo build -p troupekit-store-sqlite --features sqlcipher --locked --target aarch64-apple-ios
      - name: boundary
        if: ${{ !cancelled() && !startsWith(github.head_ref, 'release/') }}
        run: sh scripts/check-boundary.sh
      - name: size report prints every row
        if: ${{ !cancelled() }}
        shell: bash
        run: test "$(sh scripts/size-report.sh --dry-run | grep -c '^build ')" = 6
      - name: test changed crates
        if: ${{ !cancelled() && !startsWith(github.head_ref, 'release/') }}
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set +e
          pkgs="$(sh scripts/changed-crates.sh "origin/$BASE")"
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "no crate changed"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "changed-crates.sh failed with exit $code"
            exit "$code"
          fi
          cargo test --locked $pkgs
      - name: full suite
        if: ${{ !cancelled() && startsWith(github.head_ref, 'release/') }}
        env:
          TROUPEKIT_E2E_RUNS: "100"
        run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: deny-cache
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-0.22.1
      - name: install cargo-deny
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.22.1 --locked
      - name: check
        run: cargo deny check
      - name: binding crates stay outside the core
        shell: bash
        run: |
          for crate in troupekit troupekit-kit troupekit-ffi-core; do
            tree="$(cargo tree -p "$crate" -e normal --locked)"
            test -n "$tree"
            if printf '%s\n' "$tree" | grep -E 'uniffi|pyo3'; then
              echo "$crate depends on a binding crate"
              exit 1
            fi
          done

  bindings-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: build the host library
        run: cargo build -p troupekit-ffi --release --locked
      - name: generate Swift and Kotlin
        shell: bash
        run: |
          set -euo pipefail
          lib=target/release/libtroupekit_ffi.so
          test -f "$lib"
          for language in swift kotlin; do
            cargo run -p troupekit-ffi --features bindgen --release --locked --bin uniffi-bindgen -- \
              generate --library "$lib" --language "$language" --out-dir "target/drift/$language"
          done
          test -f target/drift/swift/Troupekit.swift
          test -f target/drift/kotlin/dev/troupekit/troupekit_ffi.kt
      - name: checked-in bindings match the Rust code
        shell: bash
        run: |
          set -euo pipefail
          status=0
          while read -r generated checked; do
            if [ ! -f "$checked" ]; then
              echo "::error file=$checked::missing: take it from the bindings-generated artifact"
              status=1
              continue
            fi
            if ! cmp -s "$generated" "$checked"; then
              echo "::error file=$checked::stale: regenerate with scripts/build-xcframework.sh or scripts/build-aar.sh"
              diff -u "$checked" "$generated" | head -n 200 || true
              status=1
            fi
          done <<'PAIRS'
          target/drift/swift/Troupekit.swift bindings/swift/Sources/Troupekit/Troupekit.swift
          target/drift/kotlin/dev/troupekit/troupekit_ffi.kt bindings/kotlin/troupekit/src/main/kotlin/dev/troupekit/troupekit_ffi.kt
          PAIRS
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bindings-generated
          path: target/drift
          if-no-files-found: error

  kotlin-jvm:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: build the host library and the Kotlin bindings
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p troupekit-ffi --release --locked
          lib=""
          for candidate in target/release/libtroupekit_ffi.so target/release/libtroupekit_ffi.dylib; do
            if [ -f "$candidate" ]; then
              lib="$candidate"
            fi
          done
          test -n "$lib"
          kotlin=bindings/kotlin/troupekit/src/main/kotlin/dev/troupekit/troupekit_ffi.kt
          test -f "$kotlin"
      - name: JVM contract runner
        shell: bash
        working-directory: bindings/kotlin
        run: |
          set -euo pipefail
          test -f gradle/verification-metadata.xml
          ./gradlew --no-daemon :troupekit:testDebugUnitTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: kotlin-test-reports-${{ matrix.runner }}
          path: bindings/kotlin/troupekit/build/reports/tests/
          if-no-files-found: warn

  android-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: build the AAR with the emulator ABI
        shell: bash
        run: |
          set -euo pipefail
          test -f bindings/kotlin/gradle/verification-metadata.xml
          rustup target add aarch64-linux-android x86_64-linux-android
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" sh scripts/build-aar.sh --emulator
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          working-directory: bindings/kotlin
          script: ./gradlew --no-daemon :troupekit:connectedDebugAndroidTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: kotlin-test-reports-android
          path: bindings/kotlin/troupekit/build/reports/androidTests/
          if-no-files-found: warn

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: build the XCFramework and the Swift bindings
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          sh scripts/build-xcframework.sh
      - name: Swift contract runner
        run: swift test

  ffi-overhead:
    if: contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: build every binding
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          sh scripts/build-xcframework.sh
          cargo build -p troupekit-ffi --release --locked
          kotlin=bindings/kotlin/troupekit/src/main/kotlin/dev/troupekit/troupekit_ffi.kt
          test -f "$kotlin"
          sh scripts/build-wheel.sh dist
          python3 -m venv bench-venv
          bench-venv/bin/python -m pip install --quiet dist/troupekit-*-abi3-*.whl
          cargo build -p troupekit-ffi --example overhead --release --locked
      - name: quiet and loaded runs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/overhead.txt"
          : > "$out"
          export TROUPEKIT_BENCH=1 TROUPEKIT_BENCH_OUT="$out"
          run_all() {
            export TROUPEKIT_BENCH_LABEL="$1"
            cargo run -p troupekit-ffi --example overhead --release --locked >> "$out"
            swift test -c release -Xswiftc -enable-testing --filter OverheadTests
            (cd bindings/kotlin && ./gradlew --no-daemon :troupekit:testDebugUnitTest \
              --tests dev.troupekit.contract.OverheadTest --rerun)
            (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/bench-venv/bin/python" \
              "$GITHUB_WORKSPACE/crates/troupekit-py/tests/bench_overhead.py")
          }
          run_all quiet
          hogs=()
          for _ in $(seq "$(sysctl -n hw.ncpu)"); do
            yes > /dev/null &
            hogs+=("$!")
          done
          run_all loaded
          kill "${hogs[@]}"
          cat "$out"
          test "$(grep -c '^overhead ' "$out")" = 32
          cp "$out" overhead.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ffi-overhead
          path: overhead.txt
          if-no-files-found: error

  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
            container: ''
            python: python3
            compat: ''
          - name: linux-x86_64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            python: /opt/python/cp311-cp311/bin/python3
            compat: manylinux_2_28
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            python: /opt/python/cp311-cp311/bin/python3
            compat: manylinux_2_28
          - name: windows-x86_64
            runner: windows-latest
            container: ''
            python: python
            compat: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: rust in the manylinux container
        if: matrix.container != ''
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: build wheel
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}
          WHEEL_COMPAT: ${{ matrix.compat }}
        run: sh scripts/build-wheel.sh dist
      - name: pip install and end-to-end test
        shell: bash
        run: |
          "${{ matrix.python }}" -m venv e2e-venv
          if [ -x e2e-venv/bin/python ]; then py="$PWD/e2e-venv/bin/python"; else py="$PWD/e2e-venv/Scripts/python.exe"; fi
          "$py" -m pip install --quiet dist/troupekit-*-abi3-*.whl "pytest==9.2.0"
          cd "$RUNNER_TEMP"
          "$py" -m pytest "$GITHUB_WORKSPACE/crates/troupekit-py/tests/test_smoke.py" "$GITHUB_WORKSPACE/crates/troupekit-py/tests/test_e2e_toml.py" "$GITHUB_WORKSPACE/crates/troupekit-py/tests/test_host_tool.py" "$GITHUB_WORKSPACE/crates/troupekit-py/tests/test_freeze.py" "$GITHUB_WORKSPACE/crates/troupekit-py/tests/test_contract.py" --junitxml="$RUNNER_TEMP/pytest.xml"
          "$py" -c 'import sys, xml.etree.ElementTree as tree; suite = tree.parse(sys.argv[1]).getroot().find("testsuite"); assert suite is not None; skipped = int(suite.get("skipped")); assert int(suite.get("tests")) > 0; sys.exit(f"{skipped} Python tests skipped or xfailed; every case must run" if skipped else 0)' "$RUNNER_TEMP/pytest.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: install bend 2.0.40
        shell: bash
        run: |
          name=bend-2.0.40-linux-x64.tar.gz
          tmp="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$tmp/$name" "https://github.com/bendlang/bend/releases/download/v2.0.40/$name"
          echo "c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b  $tmp/$name" | sha256sum -c -
          tar -xzf "$tmp/$name" -C "$tmp"
          mkdir -p "$HOME/.bend/bin"
          mv "$tmp/bend/bend2" "$tmp/bend/guide" "$HOME/.bend/"
          mv "$tmp/bend/bin/bend" "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: version
        shell: bash
        run: test "$(bend version)" = "bend 2.0.40"
      - name: proofs
        shell: bash
        working-directory: proofs/agent-run
        run: bend PROOF.bend | tee out.txt && grep -qx "ALL PROOFS CHECK" out.txt

  full:
    name: full ${{ matrix.runner }}
    if: ${{ startsWith(github.head_ref, 'release/') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-full-${{ hashFiles('Cargo.lock') }}
      - name: full suite
        env:
          TROUPEKIT_E2E_RUNS: "100"
        run: cargo test --workspace --locked
