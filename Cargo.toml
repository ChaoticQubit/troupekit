[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ChaoticQubit/troupekit"
readme = "README.md"
keywords = ["agents", "llm", "workflow", "toml", "ai"]
categories = ["asynchronous", "development-tools"]
rust-version = "1.85"

[workspace.dependencies]
troupekit-core = { path = "crates/troupekit-core", version = "0.3.0" }
troupekit-index = { path = "crates/troupekit-index", version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
toml = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
