[package]
name = "troupekit-kit"
description = "Ergonomic Troupekit API: one builder or one macro per agent, tool and graph, on top of the Troupekit engine."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version = "1.89"
autotests = false

[dependencies]
troupekit-trace = { path = "../troupekit-trace", version = "0.1.0" }
troupekit-core.workspace = true
troupekit-agent = { path = "../troupekit-agent", version = "0.1.0", default-features = false }
troupekit-tools = { path = "../troupekit-tools", version = "0.1.0", default-features = false }
troupekit-providers = { path = "../troupekit-providers", version = "0.1.0", default-features = false }
troupekit-graph = { path = "../troupekit-graph", version = "0.1.0", default-features = false }
troupekit-macros = { path = "../troupekit-macros", version = "0.1.0" }
troupekit-context = { path = "../troupekit-context", version = "0.1.0", optional = true }
troupekit-store-sqlite = { path = "../troupekit-store-sqlite", version = "0.1.0", optional = true }
troupekit-local = { path = "../troupekit-local", version = "0.1.0", default-features = false, optional = true }
serde.workspace = true
serde_json.workspace = true
schemars = "1"
toml.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["time"] }

[features]
default = ["sqlite", "reqwest"]
sqlite = ["dep:troupekit-store-sqlite"]
knowledge = ["sqlite", "dep:troupekit-context", "troupekit-providers/embeddings", "troupekit-local?/embed"]
local = ["dep:troupekit-local"]
llama = ["local", "troupekit-local/llama"]
reqwest = ["troupekit-agent/reqwest", "troupekit-graph/reqwest", "troupekit-providers/reqwest"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"

[[test]]
name = "main"
path = "tests/main.rs"
