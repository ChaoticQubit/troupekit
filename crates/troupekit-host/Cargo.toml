[package]
name = "troupekit-host"
description = "Hosting for Troupekit graph runs: a leased job queue, an event log and a runner with worker and serverless step modes."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
troupekit-trace = { path = "../troupekit-trace", version = "0.2.0" }
troupekit-core.workspace = true
troupekit-agent = { path = "../troupekit-agent", version = "0.2.0", default-features = false }
troupekit-graph = { path = "../troupekit-graph", version = "0.2.0", default-features = false }
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[features]
default = ["reqwest"]
reqwest = ["troupekit-agent/reqwest", "troupekit-graph/reqwest"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
troupekit-tools = { path = "../troupekit-tools", version = "0.2.0" }
troupekit-providers = { path = "../troupekit-providers", version = "0.2.0", default-features = false }

[[test]]
name = "main"
path = "tests/main.rs"
