name = "desk"
start = "lead"
max_steps = 96

[state]
input = "string"
output = "string"
done = "bool"
tasks = "list?"
results = "list?"

[reducers]
results = "extend"

[[nodes]]
id = "lead"
kind = "agent"
persona = "lead"
prompt = "Work through the request with your coworkers. `results` holds what earlier passes finished. Put what this pass finished in `results` and the tasks still open in `tasks`. Set `done` to true and give the final answer in `answer` once nothing is left."
reads = ["input", "tasks", "results"]
delegates = ["billing", "tech"]
fields = { done = "bool", tasks = "list<string>", results = "list<string>", answer = "string" }
sets = { done = "done", tasks = "tasks", results = "results", answer = "output" }

[[nodes]]
id = "check_done"
kind = "switch"
on = "done"

[[nodes]]
id = "end"
kind = "end"

[[edges]]
from = "lead"
to = "check_done"

[[edges]]
from = "check_done"
to = "end"
when = "true"

[[edges]]
from = "check_done"
to = "lead"
when = "false"
