[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "troupekit"
description = "Build and run troupekit agents from Python."
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dynamic = ["version"]

[tool.maturin]
python-source = "python"
module-name = "troupekit._troupekit"
manifest-path = "Cargo.toml"
