[package]
name = "troupekit-local"
description = "On-device models for the Troupekit agent framework: the LocalModel trait, model catalog and llama.cpp."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
autotests = false

[features]
default = []
llama = []
llama-vulkan = ["llama"]
embed = ["dep:troupekit-context"]

[dependencies]
troupekit-core.workspace = true
troupekit-providers = { path = "../troupekit-providers", version = "0.3.0", default-features = false }
troupekit-trace = { path = "../troupekit-trace", version = "0.3.0" }
troupekit-context = { path = "../troupekit-context", version = "0.3.0", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[[test]]
name = "main"
path = "tests/main.rs"

[[example]]
name = "local_bench"
required-features = ["llama"]
