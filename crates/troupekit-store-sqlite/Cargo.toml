[package]
name = "troupekit-store-sqlite"
description = "SQLite storage for Troupekit: checkpoints, memory logs, blobs, a job queue and a usage ledger in one file."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version = "1.89"

[dependencies]
troupekit-core.workspace = true
rusqlite = { version = "0.43", features = ["bundled"] }
tokio = { workspace = true, features = ["rt"] }
async-trait.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
