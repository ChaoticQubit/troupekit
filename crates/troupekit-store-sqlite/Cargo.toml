[package]
name = "troupekit-store-sqlite"
description = "SQLite storage for Troupekit: checkpoints, memory logs, blobs, a job queue and a usage ledger in one file."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version = "1.89"
autotests = false

[dependencies]
troupekit-trace = { path = "../troupekit-trace", version = "0.3.0" }
troupekit-core.workspace = true
troupekit-index.workspace = true
rusqlite = { version = "0.43", features = ["bundled"] }
tokio = { workspace = true, features = ["rt"] }
async-trait.workspace = true
serde_json.workspace = true

[features]
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
sqlcipher-system = ["rusqlite/bundled-sqlcipher"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[test]]
name = "main"
path = "tests/main.rs"
