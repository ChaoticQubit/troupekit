[package]
name = "troupekit-context"
description = "Memory scopes, chunking, embeddings and hybrid retrieval for the Troupekit agent framework."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
troupekit-core.workspace = true
troupekit-tools = { path = "../troupekit-tools", version = "0.1.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
fastembed = { version = "7", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"], optional = true }

[features]
onnx = ["dep:fastembed"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
troupekit-store-sqlite = { path = "../troupekit-store-sqlite", version = "0.1.0" }
tempfile = "3"

[[test]]
name = "main"
path = "tests/main.rs"
