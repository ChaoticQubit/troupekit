[package]
name = "troupekit-providers"
description = "Model providers for the Troupekit agent framework: wire protocols, catalog, transports and middleware."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
autotests = false

[features]
default = ["reqwest"]
reqwest = ["dep:reqwest"]
embeddings = ["dep:troupekit-context"]

[dependencies]
troupekit-trace = { path = "../troupekit-trace", version = "0.1.0" }
troupekit-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["time"] }
toml.workspace = true
reqwest = { workspace = true, optional = true }
troupekit-context = { path = "../troupekit-context", version = "0.1.0", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[test]]
name = "main"
path = "tests/main.rs"
